name: Dependabot auto-merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  # Regenerate pnpm-lock.yaml when Dependabot bumps a backend package.
  # Dependabot updates package.json but not the workspace lockfile, causing
  # --frozen-lockfile to fail. This job fixes that before tests run.
  lockfile:
    name: Regenerate pnpm lockfile
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093  # v6.0.8
        with:
          version: 11.1.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Update lockfile if out of sync
        id: lockfile
        run: |
          if pnpm install --frozen-lockfile 2>&1 | grep -q ERR_PNPM_OUTDATED_LOCKFILE; then
            pnpm install
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated lockfile
        if: steps.lockfile.outputs.updated == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: regenerate pnpm-lock.yaml after Dependabot bump"
          git push

  # Auto-merge is handled by auto-merge.yml for all PRs.
