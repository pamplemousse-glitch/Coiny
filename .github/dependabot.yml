version: 2

updates:
  # GitHub Actions — keep action SHAs current
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(ci)"
    open-pull-requests-limit: 5
    labels:
      - deps
      - ci

  # Backend npm packages (package.json lives in /backend)
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    labels:
      - deps
    groups:
      backend-minor-patch:
        update-types:
          - minor
          - patch
