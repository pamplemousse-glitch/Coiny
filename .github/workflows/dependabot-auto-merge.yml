name: Dependabot auto-merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  # Regenerate pnpm-lock.yaml when Dependabot bumps a backend package.
  # Dependabot updates package.json but not the workspace lockfile, causing
  # --frozen-lockfile to fail. This job fixes that before tests run.
  lockfile:
    name: Regenerate pnpm lockfile
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
        with:
          version: 11.1.3

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Update lockfile if out of sync
        id: lockfile
        run: |
          pnpm install --no-frozen-lockfile
          if git diff --quiet pnpm-lock.yaml; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated lockfile
        if: steps.lockfile.outputs.updated == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: regenerate pnpm-lock.yaml after Dependabot bump"
          git push

  # Auto-merge is handled by auto-merge.yml for all PRs.
