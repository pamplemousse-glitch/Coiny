name: Android CI

on:
  push:
    branches-ignore: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    name: JVM unit tests + lint
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Handles wrapper validation + dependency / build caching.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint (Android Lint, debug variant)
        working-directory: android
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Unit tests (debug variant)
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Upload lint + test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

  # Instrumented Compose UI tests would go in a separate job that uses
  # reactivecircus/android-emulator-runner. Deliberately not enabled yet:
  # we have no androidTest sources, and the emulator cold-start is slow.
  # Add this job back when the first Compose UI test lands.
