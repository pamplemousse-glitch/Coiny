version: 2

updates:
  # GitHub Actions — keep action SHAs current
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(ci)"
    open-pull-requests-limit: 5
    labels:
      - deps
      - ci
    groups:
      # codeql-action/init, /autobuild and /analyze MUST move together.
      # Ungrouped, Dependabot raises one PR per sub-action, and each one alone
      # is unmergeable by construction: the analyze step reads the config the
      # init step wrote and refuses a version mismatch outright with
      #
      #   Loaded a configuration file for version '4.36.0', but running '4.37.7'
      #
      # which is exactly how PR #248 failed. Grouping them makes the bump one
      # reviewable change instead of three that are each individually broken.
      codeql-action:
        patterns:
          - "github/codeql-action*"

  # Backend npm packages (package.json lives in /backend)
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    labels:
      - deps
    groups:
      backend-minor-patch:
        update-types:
          - minor
          - patch
    # Major version bumps for these packages require intentional migration
    # (breaking API changes, lockfile regeneration, test updates). Ignore
    # them in Dependabot — handle manually when ready.
    ignore:
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # The Docker base image the server actually runs on.
  #
  # Until this entry existed, a CVE in `node:26-alpine` was raised by nothing:
  # Trivy scans the built image on a PR, which catches it only if someone
  # happens to open one, and no bot ever proposed the bump. This is the image
  # production runs, so it is the one whose CVEs matter most.
  #
  # Node MAJOR bumps are ignored deliberately. Dependabot would raise
  # `node:27-alpine` here while every workflow still says `node-version: '26'`,
  # which is precisely the split that bin/check-node-versions.sh now fails on.
  # A major is a decision made in one commit across both files, not a bot PR.
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 3
    labels:
      - deps
      - security
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # shared/ is live code: cross-package types imported by the backend
  # (shared/mqtt-schema, pet-model, spending-schema). Only /backend was
  # watched, so its lockfile aged with nothing to say so.
  #
  # mobile/ stays unwatched on purpose. It is the dead Expo client, superseded
  # by ios/, and watching it would generate PRs nobody should merge.
  - package-ecosystem: npm
    directory: /shared
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 3
    labels:
      - deps
    groups:
      shared-minor-patch:
        update-types:
          - minor
          - patch
