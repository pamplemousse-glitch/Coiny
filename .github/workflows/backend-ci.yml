name: Backend CI

on:
  push:
    branches-ignore: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      # Runs before anything installs, because a mismatch here means every step
      # after it is proving something about a runtime production does not use.
      # Cheap, no dependencies, and it is the only thing that compares the two
      # places Node's version is declared.
      - name: Node version agrees with the Dockerfile
        run: bin/check-node-versions.sh

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
        with:
          version: 11.1.3

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '26'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Dependency audit (SCA)
        run: pnpm audit --audit-level=high

      - name: License check (no copyleft in prod)
        working-directory: backend
        run: |
          pnpm licenses list --json 2>/dev/null > /tmp/licenses.json
          python3 << 'PYEOF'
          import json, sys
          with open('/tmp/licenses.json') as f:
            data = json.load(f)
          BLOCKED = {
            'GPL-2.0-only', 'GPL-2.0+', 'GPL-3.0-only', 'GPL-3.0+',
            'AGPL-1.0', 'AGPL-3.0-only', 'AGPL-3.0+',
            'LGPL-2.0-only', 'LGPL-2.1-only', 'LGPL-3.0-only',
          }
          PERMISSIVE = {'MIT', 'Apache-2.0', 'BSD-2-Clause', 'BSD-3-Clause', 'ISC', '0BSD', 'Unlicense', 'BlueOak-1.0.0'}
          problems = []
          for lic, pkgs in data.items():
            # Dual-license like "(BSD-3-Clause OR GPL-2.0)" is fine — elect the permissive side.
            if ' OR ' in lic:
              parts = {p.strip().strip('()') for p in lic.split(' OR ')}
              if parts & PERMISSIVE:
                continue
            if lic in BLOCKED or any(b in lic for b in BLOCKED):
              for pkg in pkgs:
                problems.append(f"  {pkg['name']}@{','.join(pkg['versions'])}: {lic}")
          if problems:
            print("FAIL: Prohibited copyleft licenses found:")
            for p in problems: print(p)
            sys.exit(1)
          print(f"OK: {len(data)} license groups checked, none prohibited.")
          PYEOF

      - name: Lint (Biome)
        run: pnpm --filter coiny-backend lint

      - name: Typecheck
        run: pnpm --filter coiny-backend typecheck

      - name: Test + coverage (≥75%)
        run: pnpm --filter coiny-backend test:coverage
