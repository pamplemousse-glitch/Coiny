name: Secret scan (full history)

# The gitleaks job in security.yml runs on pull_request, and in that mode
# gitleaks-action passes `--log-opts=--no-merges --first-parent <base>^..<head>`,
# so it sees the PR's commits and nothing else. That is why CI stayed green
# while `gitleaks git --log-opts="--all" -c .gitleaks.toml` exited 1 locally.
#
# On `schedule` and `workflow_dispatch` the same action passes no --log-opts at
# all, which makes it scan the whole checked-out history. This workflow exists
# only to run it in that mode, so CI covers what the repo's own config covers.
#
# Failure here is not a merge gate and is deliberately not a required check. It
# catches history that a PR-scoped scan structurally cannot see: force-pushed
# rewrites, a secret introduced on a branch that merged before a rule existed,
# and drift in .gitleaks.toml itself.

on:
  schedule:
    # Mondays, 06:17 UTC. Off the hour so it does not queue behind the
    # every-scheduled-job-on-GitHub spike at :00.
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  gitleaks-history:
    name: Gitleaks over all history
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Every commit, every branch. Without this the "full history" scan
          # would be a full scan of a one-commit history.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Must match the version pinned in security.yml, or the two scans
          # disagree about what a secret is.
          GITLEAKS_VERSION: 8.30.1
