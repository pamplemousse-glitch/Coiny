name: Security

on:
  push:
    branches-ignore: [main]
  pull_request:

# Cancel in-progress runs for the same ref when a new push lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detects whether the PR touches any code (not just docs/markdown).
  # Downstream jobs use `needs.has-code.outputs.result` to skip themselves
  # on docs-only PRs. Skipped jobs via `if:` count as passing for required
  # status checks — so merge gates are never blocked by a skipped scan.
  has-code:
    name: Detect code changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      result: ${{ steps.check.outputs.result }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
      - id: check
        run: |
          BASE=${{ github.event.pull_request.base.sha || 'HEAD~1' }}
          if git diff --name-only "$BASE"...HEAD | grep -qvE '^(docs/|\.github/workflows/|.*\.md$)'; then
            echo "result=true" >> "$GITHUB_OUTPUT"
          else
            echo "result=false" >> "$GITHUB_OUTPUT"
          fi

  semgrep:
    name: Semgrep SAST
    needs: has-code
    if: needs.has-code.outputs.result == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      # `auto` selects rulesets based on detected languages.
      # See https://semgrep.dev/explore for rulesets that get pulled.
      - uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d  # v1
        with:
          config: auto
        env:
          SEMGREP_TIMEOUT: 300

  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # Need full history so gitleaks can scan everything pushed.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Gitleaks defaults are sensible; .gitleaks.toml at repo root overrides.

  trivy:
    name: Trivy container scan
    needs: has-code
    if: needs.has-code.outputs.result == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093  # v6.0.8
        with:
          version: 11.1.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Build backend Docker image
        run: docker build -t coiny-backend:scan -f backend/Dockerfile .

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: coiny-backend:scan
          format: table
          # Fail on HIGH/CRITICAL vulns; allow MEDIUM/LOW for now.
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore

  sbom:
    name: SBOM (CycloneDX)
    needs: has-code
    if: needs.has-code.outputs.result == 'true'
    runs-on: ubuntu-latest
    # PCI DSS 4.0 §6.3.2 — generate and retain a SBOM for every build.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093  # v6.0.8
        with:
          version: 11.1.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Generate SBOM for backend
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          path: ./backend
          format: cyclonedx-json
          output-file: sbom-backend.cdx.json
          upload-artifact: true
          artifact-name: sbom-backend-${{ github.sha }}
