name: iOS CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# macOS runner minutes are 10× the cost of Linux. The `changes` gate below
# keeps the expensive `test` job from running on backend-only or docs-only PRs,
# while the `result` job always reports so required-check branch protection
# never deadlocks.
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      has_ios: ${{ steps.check.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - id: check
        run: |
          BASE=${{ github.event.pull_request.base.sha || 'HEAD~1' }}
          if git diff --name-only "$BASE"...HEAD | grep -qE '^(ios/|\.github/workflows/ios-ci\.yml)'; then
            echo "result=true" >> "$GITHUB_OUTPUT"
          else
            echo "result=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.has_ios == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      SCHEME: Coiny
      # Pin the MAJOR, float the minor. See the comment on the selection step.
      XCODE_MAJOR: "26"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Pin the Xcode MAJOR and take the newest minor the image provides.
      #
      # Pinning a full version breaks: each minor bundles a different iOS SDK
      # and the runner image only preinstalls simulator runtimes for the newer
      # ones, so an exact pin eventually asks for a runtime nobody ships. That
      # is what happened when 16.0 was pinned explicitly.
      #
      # Floating entirely is the opposite failure: an image update lands a new
      # major on an unrelated PR and the author has no idea why their branch is
      # red. Pinning the major keeps a toolchain bump a deliberate, reviewable
      # one-line change instead of a surprise.
      #
      # This was 16.x on macos-15 until 2026-08-17 while local development ran
      # Xcode 26.5, a gap of ten majors that nothing surfaced. `toolchain-drift`
      # below is what stops that recurring.
      - name: Select latest Xcode ${{ env.XCODE_MAJOR }}.x
        run: |
          set -euo pipefail
          XCODE_PATH=$(ls -d /Applications/Xcode_${XCODE_MAJOR}*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "${XCODE_PATH:-}" ]; then
            echo "::error::No Xcode ${XCODE_MAJOR}.x on this runner image. Available:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"
          echo "Using $XCODE_PATH"

      - name: Show Xcode + simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available iOS

      - name: Install build tools
        # NOT pinned, on purpose. Brew publishes no versioned formulae for
        # these three, and pinning would freeze CI the way the Xcode major pin
        # did, which is the bug this records rather than repeats.
        #
        # The defect was never that they float. It is that nothing recorded what
        # they floated TO, so a PR that was green in the morning and red in the
        # afternoon with no repository change looked like your own bug. The
        # versions go in the job summary so that break is self-explaining.
        run: |
          brew install xcodegen xcbeautify swiftlint
          {
            echo "### Build tools, resolved at run time"
            echo ""
            echo "Unpinned by design. If this job broke with no change to the"
            echo "repository, diff these against the last green run before"
            echo "looking anywhere else."
            echo ""
            echo "| Tool | Version |"
            echo "|---|---|"
            echo "| xcodegen | $(xcodegen --version 2>&1 | tail -1) |"
            echo "| xcbeautify | $(xcbeautify --version 2>&1 | tail -1) |"
            echo "| swiftlint | $(swiftlint version 2>&1 | tail -1) |"
            echo "| Xcode | $(xcodebuild -version 2>/dev/null | head -1) |"
            echo "| macOS image | $(sw_vers -productVersion) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cache SwiftPM dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('ios/project.yml') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Lint (SwiftLint)
        working-directory: ios
        run: swiftlint lint --strict Coiny

      # Hardcoded device names (e.g. "iPhone 16") fail when the runner image
      # ships a different default simulator. Instead, pick the first available
      # iOS Simulator's UDID dynamically and target that exact device.
      - name: Pick a simulator destination
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; \
                          runtimes=sorted([k for k in d if "iOS" in k]); \
                          devs=[x for r in runtimes for x in d[r] if x.get("isAvailable") and "iPhone" in x["name"]]; \
                          print(devs[0]["udid"]) if devs else sys.exit("no iPhone simulator available")')
          echo "destination=platform=iOS Simulator,id=$UDID" >> "$GITHUB_OUTPUT"
          echo "Selected simulator UDID: $UDID"

      - name: Build + test
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test \
            -project Coiny.xcodeproj \
            -scheme "$SCHEME" \
            -sdk iphonesimulator \
            -destination "${{ steps.simulator.outputs.destination }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            | xcbeautify --renderer github-actions

      - name: Upload xcresult bundle on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ios-xcresult
          path: ios/TestResults.xcresult
          retention-days: 7

  result:
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate
        run: |
          if [[ "${{ needs.changes.outputs.has_ios }}" != "true" ]]; then
            echo "No iOS changes – skipping."
            exit 0
          fi
          if [[ "${{ needs.test.result }}" == "success" ]]; then
            exit 0
          fi
          echo "iOS tests ${{ needs.test.result }}."
          exit 1
