name: Coiny
options:
  bundleIdPrefix: app.coiny
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Set your 10-character Apple Developer Team ID here (found at developer.apple.com/account).
    # Also enable "Sign In with Apple" capability for bundle ID app.coiny.ios in the Developer Portal.
    DEVELOPMENT_TEAM: ""

# Build configurations — Debug for local + Simulator, Release for TestFlight + App Store
configs:
  Debug: debug
  Release: release

packages:
  LinkKit:
    url: https://github.com/plaid/plaid-ios
    from: "5.6.0"

targets:
  Coiny:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    # Coiny/PrivacyInfo.xcprivacy is the app-target privacy manifest
    # (PRD R-22.2); xcodegen places .xcprivacy files in the Resources build
    # phase automatically, so it ships at the bundle root. Keep it in sync
    # with docs/legal/app-store-privacy-labels.md.
    sources:
      - path: Coiny
        excludes:
          - "**/*.md"
      # The Terms and the privacy notice ship IN the binary: Apple requires
      # functional links to both for auto-renewable subscriptions, and Reg P
      # 1016.9(a) requires the notice to be delivered rather than merely
      # hosted. There is no domain yet (runbook G1.2), so the app renders these
      # two files directly. They are referenced out of docs/legal rather than
      # copied, so the shipped text and the reviewed text cannot drift.
      # When a hosted URL exists, see LegalDocument.hostedURL.
      - path: ../docs/legal/privacy-policy.md
        buildPhase: resources
      - path: ../docs/legal/terms-of-service.md
        buildPhase: resources
    info:
      path: Coiny/Info.plist
      properties:
        CFBundleDisplayName: Coiny
        CFBundleURLTypes:
          - CFBundleURLName: app.coiny.ios
            CFBundleURLSchemes:
              - coiny
        # Version, and the build number that goes with it.
        #
        # CFBundleShortVersionString is MARKETING_VERSION, edited by hand once
        # per release; the release commit is tagged ios-v<version>.
        # CFBundleVersion is stamped at build time from the git commit count by
        # Scripts/stamp-build-number.sh, so a second TestFlight upload cannot
        # collide with the first. The literal below is only the fallback for a
        # build with no git history. See ios/README.md, "Versioning".
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Which backend this build talks to. Set per configuration below, so a
        # TestFlight build can point at staging without touching code.
        COINY_API_BASE_URL: $(COINY_API_BASE_URL)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: false
        # bluetooth-central and NSBluetoothAlwaysUsageDescription removed
        # 2026-08-13: no CoreBluetooth code exists in the app and hardware is
        # parked (vision.md section 8). An unused background mode is an App
        # Review 2.5.4 rejection risk. Restore both when hardware ships.
        UIBackgroundModes:
          - remote-notification
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: Coiny/Coiny.entitlements
      properties:
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.coiny.ios
        # The one place the marketing version is written. Bump it in the same
        # commit that gets tagged ios-v<version>; the build script fails the
        # build if the tag on HEAD disagrees with this value.
        MARKETING_VERSION: "0.2.0"
        # Fallback only. Every build from a git checkout overwrites this with
        # the commit count (Scripts/stamp-build-number.sh).
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Cleared deliberately. Adding Assets.xcassets (for AccentColor) makes
        # Xcode look for an app icon set named "AppIcon" and fail the build when
        # it is absent, and there is no commissioned icon yet
        # (design-direction section 5). Set this back to AppIcon and add the
        # icon set in the same commit; App Store submission requires one.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        # Without this the AccentColor colorset compiles into Assets.car and is
        # then never read: nothing writes NSAccentColorName into Info.plist, so
        # `.tint(.accentColor)` keeps resolving to system blue. Shipping the
        # asset alone looked correct in code review and in a green test run, and
        # was visibly wrong on screen.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Which backend a device build talks to. Staging, for every
        # configuration, because production does not exist yet.
        #
        # When it does, add a `configs:` block overriding this for Release only.
        # Staging stays the default so that a build which forgets to opt in
        # reaches the environment full of fake data, never real bank accounts.
        # ($() defeats Xcode's // comment stripping in build settings.)
        COINY_API_BASE_URL: https:/$()/coiny-backend.fly.dev
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - package: LinkKit
        product: LinkKit
    # Runs after every build phase and before code signing, rewriting
    # CFBundleVersion inside the built product. Nothing in the source tree is
    # touched, so a build never produces a dirty working copy.
    postBuildScripts:
      - name: Stamp CFBundleVersion from git
        script: '"$SRCROOT/Scripts/stamp-build-number.sh"'
        basedOnDependencyAnalysis: false

  CoinyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CoinyTests
    dependencies:
      - target: Coiny
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.coiny.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Coiny.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Coiny"

  CoinyUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CoinyUITests
    dependencies:
      - target: Coiny
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.coiny.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        # XcodeGen 2.x bleeds BUNDLE_LOADER from the base settings template into
        # ui-testing targets. BUNDLE_LOADER must be empty for UI tests — setting
        # it to the app binary (as for unit tests) causes the test runner to try
        # to inject the bundle as a hosted unit test, which hangs the simulator
        # indefinitely on iOS 16+. Explicitly clear it here to override.
        BUNDLE_LOADER: ""
        TEST_HOST: ""

schemes:
  Coiny:
    build:
      targets:
        Coiny: all
        CoinyTests: [test]
        CoinyUITests: [test]
    run:
      config: Debug
      # Local StoreKit configuration: makes the subscription products, purchase
      # flow and renewals testable in the simulator with no App Store Connect
      # products (those are blocked on the org enrollment, R-27.1).
      storeKitConfiguration: Coiny.storekit
    test:
      config: Debug
      targets:
        - CoinyTests
        - CoinyUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
