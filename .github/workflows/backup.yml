name: Nightly Backup

# The second backup layer (PRD R-20.1, runbook G1.27, audit rows 4.12.2 and
# 4.12.3). Until this existed, Neon's point-in-time window was the ENTIRE backup
# strategy: six hours on the Free plan, which means corruption or a bad
# migration discovered on a Monday morning is unrecoverable if it landed on
# Sunday night. The stated RPO of 24 hours described this job, and this job did
# not exist.
#
# What it does: pg_dump the production branch, encrypt the stream to the backup
# PUBLIC key, and keep the ciphertext as a 30-day artifact. The private half
# lives only in the founder's Keychain, so a full compromise of this runner
# yields the ability to write backups and not to read them.
#
# Requires NEON_API_KEY and BACKUP_PUBLIC_KEY. Missing either, the job SKIPS
# with an explanation rather than failing: the pair is a founder step
# (docs/backup-runbook.md), and a red X every night for a task nobody has
# scheduled is how a real failure gets ignored.
#
# Restoring one of these is docs/backup-runbook.md; restoring from Neon's own
# window is docs/restore-runbook.md. They are different procedures.

on:
  schedule:
    # 07:10 UTC, a few minutes past the hour because the whole world crons on
    # the hour and GitHub delays a busy schedule. Nothing here is time-critical
    # to the minute; missing a night entirely is what matters.
    - cron: '10 7 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-backup
  cancel-in-progress: false

permissions:
  contents: read

env:
  NEON_PROJECT_ID: noisy-bonus-65551609
  NEON_BRANCH: production
  # The client major to install. pg_dump refuses a server newer than itself, so
  # this is checked against the live server below rather than assumed.
  PG_MAJOR: '17'

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check for the secrets
        id: guard
        # Via env, never interpolated into the shell: `${{ secrets.X }}` inside
        # a run block puts the value into the command line itself.
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          BACKUP_PUBLIC_KEY: ${{ secrets.BACKUP_PUBLIC_KEY }}
        run: |
          missing=""
          [ -z "$NEON_API_KEY" ] && missing="$missing NEON_API_KEY"
          [ -z "$BACKUP_PUBLIC_KEY" ] && missing="$missing BACKUP_PUBLIC_KEY"
          if [ -n "$missing" ]; then
            echo "::warning::Nightly backup skipped, missing secrets:$missing (see docs/backup-runbook.md)"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        if: steps.guard.outputs.available == 'true'
        with:
          node-version: '26'

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
        if: steps.guard.outputs.available == 'true'
        with:
          version: 11.1.3

      - name: Install
        if: steps.guard.outputs.available == 'true'
        run: pnpm install --frozen-lockfile --filter coiny-backend...

      # The runner image ships whatever postgresql-client it ships, and pg_dump
      # REFUSES to dump a server newer than itself. Installing from PGDG makes
      # the client version a decision in this file instead of a property of an
      # image that changes underneath us.
      - name: Install pg_dump ${{ env.PG_MAJOR }}
        if: steps.guard.outputs.available == 'true'
        run: |
          set -euo pipefail
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y "postgresql-client-${PG_MAJOR}"
          "/usr/lib/postgresql/${PG_MAJOR}/bin/pg_dump" --version

      - name: Dump and encrypt
        if: steps.guard.outputs.available == 'true'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          BACKUP_PUBLIC_KEY: ${{ secrets.BACKUP_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          # Captured into the environment and never echoed: this string carries
          # a database password and job logs are retained.
          #
          # NOT --pooled. The pooled endpoint is PgBouncer in transaction mode,
          # which cannot serve pg_dump's session-level work; a dump taken
          # through it is a dump that fails, or worse, one that half-succeeds.
          DATABASE_URL="$(npx neonctl connection-string "$NEON_BRANCH" \
            --project-id "$NEON_PROJECT_ID")"
          export DATABASE_URL

          PGDUMP="/usr/lib/postgresql/${PG_MAJOR}/bin/pg_dump"
          SERVER_MAJOR="$("/usr/lib/postgresql/${PG_MAJOR}/bin/psql" "$DATABASE_URL" \
            -tAc 'SHOW server_version_num' | cut -c1-2)"
          if [ "$SERVER_MAJOR" -gt "$PG_MAJOR" ]; then
            echo "::error::Server is PostgreSQL $SERVER_MAJOR, client is $PG_MAJOR. Bump PG_MAJOR in this file."
            exit 1
          fi

          STAMP="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          mkdir -p artifacts
          # --format=custom so pg_restore can be selective, --no-owner and
          # --no-privileges because the restore target's roles are created by
          # the role split (G2.9) and not by this dump.
          #
          # The pipe is the point: the plaintext dump never touches the runner's
          # disk. set -o pipefail above means a pg_dump failure fails the step
          # rather than producing a small, well-formed, encrypted nothing.
          "$PGDUMP" "$DATABASE_URL" \
              --format=custom --no-owner --no-privileges --compress=0 \
            | pnpm --filter coiny-backend exec tsx scripts/backup-encrypt.ts \
                "$GITHUB_WORKSPACE/artifacts/coiny-${NEON_BRANCH}-${STAMP}.dump.enc" \
                "${NEON_BRANCH} ${STAMP}"

          ls -l artifacts

      # 30 days, which is the retention R-20.1 specifies and the number
      # docs/legal/privacy-policy.md already promises users. Changing it here
      # makes that sentence false; change the sentence first.
      - name: Keep it for 30 days
        if: steps.guard.outputs.available == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coiny-backup-${{ github.run_id }}
          path: artifacts/*.dump.enc
          retention-days: 30
          if-no-files-found: error
