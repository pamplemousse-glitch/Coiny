name: iOS CI

on:
  push:
    branches-ignore: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-ci.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# macOS runner minutes are 10× the cost of Linux. The path filter above keeps
# this job from firing on backend-only PRs.
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      # Pin Xcode for reproducibility. Bump in lockstep with ios/project.yml's
      # `xcodeVersion`. macos-15 ships Xcode 16.x; if the exact patch is missing
      # on a future image, drop the `.1` to fall back to the latest 16.x.
      DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer
      SCHEME: Coiny

    steps:
      - uses: actions/checkout@v6

      - name: Show Xcode + simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available iOS

      - name: Install build tools
        run: |
          brew install xcodegen xcbeautify

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('ios/project.yml') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      # Hardcoded device names (e.g. "iPhone 16") fail when the runner image
      # ships a different default simulator. Instead, pick the first available
      # iOS Simulator's UDID dynamically and target that exact device.
      - name: Pick a simulator destination
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; \
                          runtimes=sorted([k for k in d if "iOS" in k]); \
                          devs=[x for r in runtimes for x in d[r] if x.get("isAvailable") and "iPhone" in x["name"]]; \
                          print(devs[0]["udid"]) if devs else sys.exit("no iPhone simulator available")')
          echo "destination=platform=iOS Simulator,id=$UDID" >> "$GITHUB_OUTPUT"
          echo "Selected simulator UDID: $UDID"

      - name: Build + test
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test \
            -project Coiny.xcodeproj \
            -scheme "$SCHEME" \
            -sdk iphonesimulator \
            -destination "${{ steps.simulator.outputs.destination }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            | xcbeautify --renderer github-actions

      - name: Upload xcresult bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcresult
          path: ios/TestResults.xcresult
          retention-days: 7
